<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYSTEM POWER UP</title>
<style>
:root{
  --bg:#06050c; --violet:#7b2cff; --blue:#3a8dff; --ice:#bfe0ff; --panel:rgba(10,24,64,.78);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;height:100%;min-height:100%;background:var(--bg);color:var(--ice);
  font-family:"Rajdhani","Segoe UI",Roboto,Arial,sans-serif;
  display:flex;overflow-y:auto;position:relative;
}
/* фиолетовые углы */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 0% 0%,rgba(123,44,255,.55),transparent 42%),
    radial-gradient(circle at 100% 0%,rgba(123,44,255,.45),transparent 40%),
    radial-gradient(circle at 0% 100%,rgba(123,44,255,.45),transparent 40%),
    radial-gradient(circle at 100% 100%,rgba(123,44,255,.55),transparent 42%);
}
.wrap{width:100%;max-width:420px;padding:20px;position:relative;z-index:1;margin:auto}
.sys{
  position:relative;background:var(--panel);border:2px solid var(--blue);
  box-shadow:0 0 22px rgba(58,141,255,.55),inset 0 0 28px rgba(58,141,255,.18);
  backdrop-filter:blur(3px);padding:22px 20px 20px;
  animation:open .55s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes open{0%{opacity:0;transform:scale(.55) scaleY(.1)}60%{opacity:1;transform:scale(1.03) scaleY(1)}100%{transform:scale(1)}}
.sys::before,.sys::after{content:"";position:absolute;width:16px;height:16px;border:3px solid var(--ice)}
.sys::before{top:-5px;left:-5px;border-right:0;border-bottom:0}
.sys::after{bottom:-5px;right:-5px;border-left:0;border-top:0}
.title{
  text-align:center;font-size:22px;font-weight:700;letter-spacing:.35em;color:#fff;
  text-shadow:0 0 10px var(--blue);padding:4px 0 14px;margin-bottom:16px;
  border-bottom:1px solid rgba(191,224,255,.35);
}
.title i{font-style:normal;opacity:.5;margin:0 .35em}
.step{font-size:14px;letter-spacing:.12em;opacity:.7;margin-bottom:6px}
.q{font-size:21px;line-height:1.3;color:#fff;margin:0 0 16px;font-weight:600}
input[type=text],input[type=number]{
  width:100%;background:rgba(4,10,30,.7);border:1px solid var(--blue);color:#fff;
  font:inherit;font-size:20px;padding:13px 14px;outline:none;border-radius:0;
}
input:focus{box-shadow:0 0 12px rgba(58,141,255,.8)}
input::placeholder{color:rgba(191,224,255,.4)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{
  background:rgba(4,10,30,.7);border:1px solid rgba(58,141,255,.6);color:var(--ice);
  font:inherit;font-size:18px;padding:13px 6px;cursor:pointer;
}
.opt.on{background:var(--blue);color:#04122e;border-color:#fff;box-shadow:0 0 14px var(--blue);font-weight:700}
.opts.one{grid-template-columns:1fr}
.opt.wide{grid-column:1/-1}
.chk::before{content:"☐ "}
.chk.on::before{content:"☑ "}
.hint{font-size:14px;opacity:.65;margin:-8px 0 12px}
.err{min-height:20px;margin:8px 0 0;font-size:15px;color:#ff7a9a}
.btn{
  display:block;width:100%;margin-top:10px;padding:14px;font:inherit;font-size:19px;font-weight:700;
  letter-spacing:.2em;color:#fff;background:linear-gradient(90deg,#4a1fb8,var(--violet));
  border:1px solid #c9a6ff;box-shadow:0 0 16px rgba(123,44,255,.7);cursor:pointer;
}
.btn:active{transform:scale(.98)}
.bar{height:4px;background:rgba(191,224,255,.15);margin-top:16px}
.bar b{display:block;height:100%;width:0;background:var(--blue);box-shadow:0 0 8px var(--blue);transition:width .3s}
.list{margin:0 0 6px;padding:0;list-style:none;font-size:19px}
.list li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid rgba(191,224,255,.2)}
.list span{opacity:.65}
.list b{color:#fff;text-align:right}
.hero{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:24px;font-weight:700;color:#fff;margin-bottom:12px;letter-spacing:.08em}
.hero span{font-size:17px;color:var(--ice);border:1px solid var(--blue);padding:2px 10px;box-shadow:0 0 10px rgba(58,141,255,.5);white-space:nowrap}
.lvl{display:flex;align-items:center;gap:12px;margin:4px 0 12px;font-size:26px;font-weight:700;color:#fff;text-shadow:0 0 10px var(--blue);white-space:nowrap}
.lvl i{flex:1;height:1px;background:rgba(191,224,255,.45)}
.xpbar{height:12px;background:rgba(191,224,255,.12);border:1px solid rgba(58,141,255,.6)}
.xpbar b{display:block;height:100%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.xpn{text-align:right;font-size:14px;opacity:.7;margin:4px 0 14px}
.note{font-size:16px;opacity:.75;margin:0 0 12px}
.gain{font-size:16px;color:#8dffb5;margin:0 0 12px}
.link{display:block;width:100%;margin-top:10px;padding:10px;background:none;border:0;color:var(--ice);opacity:.7;font:inherit;font-size:15px;letter-spacing:.15em;cursor:pointer}
.btn.off{background:rgba(58,141,255,.2);box-shadow:none;border-color:rgba(191,224,255,.3);opacity:.7}
.task{display:block;width:100%;text-align:left;margin-bottom:8px;font-size:17px;padding:11px 12px}
.opt:disabled{cursor:default}
.trow{display:flex;align-items:center;gap:10px;border:1px solid rgba(58,141,255,.6);background:rgba(4,10,30,.7);padding:10px 12px;margin-bottom:8px}
.trow.lock{opacity:.4;border-color:rgba(191,224,255,.25)}
.trow.on{background:var(--blue);color:#04122e;border-color:#fff;box-shadow:0 0 14px var(--blue)}
.trow.ready{border-color:#fff;box-shadow:0 0 14px rgba(58,141,255,.8)}
.tx{flex:1;font-size:17px;line-height:1.2}
.tx small{display:block;font-size:13px;opacity:.7;margin-top:3px}
.bx{width:28px;height:28px;border:2px solid var(--ice);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none;background:none;color:inherit;font-family:inherit;padding:0;border-radius:0}
.trow.lock .bx,.trow:not(.ready):not(.on) .bx{border-color:rgba(191,224,255,.35)}
.trow.ready .bx{border-color:#fff;box-shadow:0 0 10px var(--blue);cursor:pointer}
.trow.on .bx{border-color:#04122e}
.go{font:inherit;font-size:14px;font-weight:700;letter-spacing:.1em;color:#fff;background:linear-gradient(90deg,#4a1fb8,var(--violet));border:1px solid #c9a6ff;padding:9px 10px;cursor:pointer;flex:none}
.camrow{display:flex;gap:14px;align-items:center;margin:0 0 12px}
.camwrap{position:relative;width:min(44vw,220px);aspect-ratio:3/4;flex:none;border:2px solid var(--blue);box-shadow:0 0 12px rgba(58,141,255,.6);background:#000;overflow:hidden}
#cam{display:block;width:100%;height:100%;object-fit:cover;background:#101827;transform:scaleX(-1)}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
.tip{font-size:13px;opacity:.7;margin:0 0 8px;line-height:1.25}
.tm{font-size:40px;font-weight:700;color:#fff;text-shadow:0 0 10px var(--blue);line-height:1}
.stt{font-size:15px;opacity:.85;margin:4px 0 8px}
.stt.bad{color:#ff9ab0;opacity:1}
.btn.alt{background:rgba(4,10,30,.7);border-color:var(--blue);box-shadow:none}
.hero .nm{border:0;box-shadow:none;padding:0;font-size:24px;color:#fff}
.ttl{font-size:14px;letter-spacing:.14em;color:#c9a6ff;margin:-6px 0 10px}
.warn{border:1px solid #ff5d7d;background:rgba(120,10,40,.35);color:#ffb3c4;padding:10px 12px;font-size:15px;margin:0 0 12px;line-height:1.3}
.btn.red{background:linear-gradient(90deg,#8a1030,#e0245a);border-color:#ff9ab0;box-shadow:0 0 16px rgba(224,36,90,.7)}
.q.red{color:#ff7a9a;text-shadow:0 0 10px rgba(255,60,100,.7)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.duo .btn{margin-top:0;font-size:15px;letter-spacing:.1em;padding:12px 4px}
.lvlup{text-align:center;padding:6px 0 14px;animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{opacity:0;transform:scale(.5);filter:brightness(3)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1);filter:none}}
.lu-t{font-size:24px;font-weight:700;letter-spacing:.2em;color:#fff;text-shadow:0 0 12px var(--blue)}
.lu-b{font-size:54px;font-weight:700;color:#fff;margin:10px 0 4px;animation:glow 1.3s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px var(--blue),0 0 24px var(--violet)}to{text-shadow:0 0 22px #9bd0ff,0 0 52px #a35cff}}
.lu-s{font-size:20px;letter-spacing:.15em;color:#c9a6ff;margin-bottom:10px}
.lu-l{font-size:16px;opacity:.85;margin:6px 0}
.lu-n{margin:14px 0 4px;padding:10px;border:1px solid #fff;box-shadow:0 0 14px var(--violet);font-size:14px;letter-spacing:.12em;color:#c9a6ff}
.lu-n b{display:block;font-size:22px;color:#fff;letter-spacing:.06em;margin-top:2px}
@media (prefers-reduced-motion:reduce){.sys,.lvlup,.lu-b{animation:none}}

/* РЕЙТИНГ ОХОТНИКОВ */
/* ДРУЗЬЯ ОХОТНИКОВ */
.rank-badge.friends-badge{
  right:92px;border-color:var(--violet);color:#dcc6ff;
  box-shadow:0 0 10px rgba(123,44,255,.45);
}
.rank-badge.friends-badge:hover{border-color:#fff;box-shadow:0 0 16px var(--violet);color:#fff}
.rank-badge.friends-badge .dot{background:#c084fc;box-shadow:0 0 8px #c084fc}
.fr-box{
  background:rgba(12,8,28,.85);border:1px solid var(--violet);
  padding:12px;margin-bottom:14px;box-shadow:0 0 14px rgba(123,44,255,.25);
}
.fr-input{
  width:100%;background:rgba(4,10,30,.85);border:1px solid var(--blue);
  color:#fff;padding:9px 12px;font:inherit;font-size:14px;margin:8px 0;
  box-sizing:border-box;outline:none;
}
.fr-input:focus{border-color:#c084fc;box-shadow:0 0 10px var(--violet)}
.fr-del-btn{
  background:transparent;border:none;color:#ff5e5e;cursor:pointer;
  font-size:15px;padding:2px 6px;margin-left:8px;opacity:.7;transition:opacity .2s;
}
.fr-del-btn:hover{opacity:1}

.rank-badge{
  position:absolute;top:14px;right:16px;
  background:rgba(4,10,30,.85);border:1px solid var(--blue);
  color:var(--ice);font:inherit;font-size:12px;font-weight:700;
  letter-spacing:.12em;padding:5px 10px;cursor:pointer;
  box-shadow:0 0 10px rgba(58,141,255,.4);display:flex;align-items:center;gap:6px;
  transition:all .2s;z-index:10;
}
.rank-badge:hover{background:var(--blue);color:#04122e;box-shadow:0 0 16px var(--blue)}
.dot{width:7px;height:7px;border-radius:50%;background:#8dffb5;box-shadow:0 0 6px #8dffb5;animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.r-card{
  background:rgba(4,10,30,.75);border:1px solid rgba(58,141,255,.5);
  padding:10px 12px;margin-bottom:8px;position:relative;transition:all .2s;
}
.r-card.me{
  border-color:#fff;background:rgba(58,141,255,.2);
  box-shadow:0 0 14px rgba(58,141,255,.6);
}
.r-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.r-pos{font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.r-pos.top1{color:#ffd700;text-shadow:0 0 10px #ffd700}
.r-pos.top2{color:#e0e0e0;text-shadow:0 0 8px #e0e0e0}
.r-pos.top3{color:#cd7f32;text-shadow:0 0 8px #cd7f32}
.r-status{font-size:12px;display:flex;align-items:center;gap:5px;opacity:.9}
.r-sub{display:flex;justify-content:space-between;font-size:13px;opacity:.75}
.r-ttl{font-size:13px;color:#c9a6ff;margin:2px 0 4px}
.r-stats{display:flex;gap:10px;font-size:13px}
.r-stats b{color:#fff}
.r-tag{border:1px solid var(--blue);padding:1px 6px;font-size:11px;color:var(--ice);margin-left:6px}

/* Gates & boss battles */
.btn.gates-btn{background:linear-gradient(90deg,#8a1030,#7b2cff);border:1px solid #ff7bba;box-shadow:0 0 18px rgba(224,36,90,.65);margin-top:10px}
.gate-card{background:rgba(8,18,50,.85);border:1px solid rgba(58,141,255,.35);padding:12px;margin-bottom:12px}
.gate-card.locked{opacity:.55;filter:grayscale(.6)}.gate-card.cleared{border-color:rgba(58,255,141,.55);box-shadow:0 0 12px rgba(58,255,141,.2)}
.gate-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gate-rank{display:inline-block;font-weight:900;padding:2px 8px;font-size:14px;letter-spacing:.1em}
.gate-rank.r-E{background:#3a4454;color:#d0d8e8}.gate-rank.r-D{background:#1a5432;color:#7bf59c}.gate-rank.r-C{background:#1a4270;color:#7bd0f5}.gate-rank.r-B{background:#4b2075;color:#d07bf5}.gate-rank.r-A{background:#752044;color:#f57ba2}.gate-rank.r-S{background:linear-gradient(90deg,#991010,#7b2cff);color:#fff}
.gate-title{font-size:17px;font-weight:700;color:#fff;letter-spacing:.05em}.gate-boss{font-size:14px;color:var(--ice);margin:4px 0 8px}
.gate-info{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#8ab2e0;border-top:1px solid rgba(58,141,255,.15);padding-top:6px;margin-top:6px}
.boss-box{text-align:center;padding:16px 12px;background:rgba(15,8,30,.85);border:2px solid #e0245a;box-shadow:0 0 24px rgba(224,36,90,.45);margin-bottom:14px}
.boss-avatar{font-size:48px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 0 10px rgba(224,36,90,.8));display:inline-block;transition:transform .15s ease}.boss-avatar.hit{transform:scale(.85) rotate(-5deg);filter:brightness(2) drop-shadow(0 0 20px #ff0055)}
.boss-name{font-size:22px;font-weight:800;color:#ff9ab0;letter-spacing:.1em;text-transform:uppercase}.boss-sub{font-size:13px;color:#bfe0ff;margin-bottom:10px}
.hp-container{background:#1a0510;border:1px solid #e0245a;height:24px;position:relative;margin:10px 0 4px;overflow:hidden}.hp-fill{background:linear-gradient(90deg,#8a1030,#ff1a53);height:100%;width:100%;transition:width .25s ease;box-shadow:0 0 12px rgba(255,26,83,.8)}.hp-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.battle-task{background:rgba(10,24,64,.8);border:1px solid var(--blue);padding:10px;text-align:center;margin-bottom:12px;font-size:14px}.battle-task b{color:#7bf59c;font-size:16px}
.hit-row{display:flex;gap:8px;margin-top:10px}.hit-btn{flex:1;padding:14px 6px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;border:1px solid #ff9ab0;color:#fff}.hit-btn.btn-1{background:linear-gradient(90deg,#8a1030,#e0245a)}.hit-btn.btn-5{background:linear-gradient(90deg,#4a1fb8,#7b2cff);border-color:#c9a6ff}.hit-btn.btn-10{background:linear-gradient(90deg,#991010,#e0245a)}.hit-log{font-size:13px;color:#8ab2e0;min-height:22px;text-align:center;margin-top:8px}


.myuli-badge{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(90deg,rgba(255,215,0,.15),rgba(58,141,255,.15));border:1px solid #ffd700;box-shadow:0 0 15px rgba(255,215,0,.3);padding:8px 12px;border-radius:6px;margin:0 0 12px;font-weight:700;letter-spacing:.08em}
.shop-card{background:rgba(8,18,45,.85);border:1px solid var(--blue);box-shadow:0 0 10px rgba(58,141,255,.25);padding:12px;margin-bottom:10px;border-radius:6px}
.shop-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.shop-card-name{font-size:15px;font-weight:700;color:#fff}
.shop-card-price{font-size:13px;color:#ffd700;font-weight:700}
.shop-card-desc{font-size:12px;color:#8ab2e0;line-height:1.35;margin-bottom:8px}
.shop-section-title{font-size:12px;letter-spacing:.12em;color:#c9a6ff;text-transform:uppercase;margin:14px 0 8px;border-bottom:1px solid rgba(201,166,255,.2);padding-bottom:4px;font-weight:700}
.boss-timer-box{display:flex;justify-content:space-between;align-items:center;background:rgba(4,10,30,.85);border:1px solid #3a8dff;padding:8px 12px;margin:8px 0;border-radius:6px}
.freeze-active{animation:freezePulse 1.2s infinite alternate;border-color:#7be0ff !important;box-shadow:0 0 20px #00bfff, inset 0 0 15px #00bfff !important}
@keyframes freezePulse{0%{box-shadow:0 0 8px #7be0ff, inset 0 0 8px #7be0ff;border-color:#7be0ff}100%{box-shadow:0 0 25px #00bfff, inset 0 0 20px #00bfff;border-color:#fff}}

.poison-btn{background:linear-gradient(90deg,#4a0c20,#8b1538) !important;border-color:#ff2c7b !important;box-shadow:0 0 15px rgba(255,44,123,.4) !important;color:#fff !important}
.berserk-btn{background:linear-gradient(90deg,#5c4304,#b38308) !important;border-color:#ffd700 !important;box-shadow:0 0 15px rgba(255,215,0,.4) !important;color:#fff !important}
.second-wind-btn{background:linear-gradient(90deg,#103f42,#1d757b) !important;border-color:#4ef2bb !important;box-shadow:0 0 15px rgba(78,242,187,.4) !important;color:#fff !important}
.greed-btn{background:linear-gradient(90deg,#2b1f47,#553c8b) !important;border-color:#c9a6ff !important;box-shadow:0 0 15px rgba(201,166,255,.4) !important;color:#fff !important}
.potion-btn{margin:4px 0;padding:8px 10px;font-size:13px;width:100%;text-align:center;border-radius:4px;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="wrap"><div class="sys" id="sys"></div></div>

<script>
var QUESTIONS=[
  {key:"name",label:"Как вас зовут?",type:"text",ph:"Введите имя"},
  {key:"age",label:"Сколько вам лет?",type:"number",ph:"Например, 20",min:10,max:99},
  {key:"weight",label:"Какой у вас вес? (кг)",type:"number",ph:"Например, 75",min:30,max:300},
  {key:"height",label:"Какой у вас рост? (см)",type:"number",ph:"Например, 175",min:100,max:250},
  {key:"days",label:"В какие дни тренируетесь?",type:"multi",hint:"Можно выбрать несколько",opts:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"]},
  {key:"mind",label:"Качаем ум? Чтение книг?",type:"choice",hint:"Если пропустить, УМ уберём из статистики",opts:["ДА","ПРОПУСТИТЬ"]},
  {key:"level",label:"Какой у вас уровень подготовки?",type:"choice",hint:"От этого зависит сложность квестов",opts:["Не тренировался","Уже есть опыт","Профессионал"]}
];
var LABELS={name:"Имя",age:"Возраст",weight:"Вес",height:"Рост",mind:"Читаем книги",level:"Уровень",difficulty:"Квесты"};
var LEVELS={"Не тренировался":"Лёгкие","Уже есть опыт":"Средние","Профессионал":"Тяжёлые"};
var i=0,data={},sys=document.getElementById("sys");

function head(){return '<div class="title">SYSTEM</div>';}

function render(){
  var q=QUESTIONS[i],h=head();
  h+='<div class="step">Вопрос '+(i+1)+' из '+QUESTIONS.length+'</div>';
  h+='<p class="q">'+(i+1)+'. '+q.label+'</p>';
  if(q.hint){h+='<div class="hint">'+q.hint+'</div>';}
  if(q.type==="choice"||q.type==="multi"){
    var multi=q.type==="multi";
    h+='<div class="opts'+(q.key==="level"?' one':'')+'">';
    q.opts.forEach(function(o,idx){
      var on=multi?(data[q.key]||[]).indexOf(o)>-1:data[q.key]===o;
      var wide=(q.opts.length%2===1&&idx===q.opts.length-1)?' wide':'';
      var pre=q.key==="level"?"абв".charAt(idx)+") ":"";
      h+='<button class="opt'+(multi?' chk':'')+(on?' on':'')+wide+'" data-v="'+o+'">'+pre+o+'</button>';
    });
    h+='</div>';
  }else{
    h+='<input id="in" type="'+q.type+'" placeholder="'+q.ph+'" '+(q.type==="number"?'inputmode="numeric"':'autocomplete="off"')+' value="'+(data[q.key]||"")+'">';
  }
  h+='<div class="err" id="err"></div>';
  h+='<button class="btn" id="next">'+(i===QUESTIONS.length-1?'ГОТОВО':'ДАЛЕЕ')+'</button>';
  h+='<div class="bar"><b style="width:'+(i/QUESTIONS.length*100)+'%"></b></div>';
  sys.innerHTML=h;
  var bars=sys.querySelector(".bar b");
  setTimeout(function(){bars.style.width=((i+1)/QUESTIONS.length*100)+"%";},30);
  var inp=document.getElementById("in");
  if(inp){inp.addEventListener("keydown",function(e){if(e.key==="Enter")next();});}
  Array.prototype.forEach.call(sys.querySelectorAll(".opt"),function(b){
    b.onclick=function(){
      var v=b.getAttribute("data-v");
      if(q.type==="multi"){
        var arr=(data[q.key]||[]).slice(),p=arr.indexOf(v);
        if(p>-1){arr.splice(p,1);}
        else{
          if(v==="Всё тело"){arr=[];}
          else{var a=arr.indexOf("Всё тело");if(a>-1){arr.splice(a,1);}}
          arr.push(v);
        }
        arr.sort(function(x,y){return q.opts.indexOf(x)-q.opts.indexOf(y);});
        data[q.key]=arr;
      }else{data[q.key]=v;}
      render();
    };
  });
  document.getElementById("next").onclick=next;
}

function next(){
  var q=QUESTIONS[i],err=document.getElementById("err");
  if(q.type==="multi"){
    if(!data[q.key]||!data[q.key].length){err.textContent="Выберите хотя бы один вариант.";return;}
  }else if(q.type==="choice"){
    if(!data[q.key]){err.textContent="Выберите один вариант.";return;}
  }else{
    var v=document.getElementById("in").value.trim();
    if(!v){err.textContent="Ответьте на вопрос.";return;}
    if(q.type==="number"){
      var n=Number(v);
      if(isNaN(n)||n<q.min||n>q.max){err.textContent="Введите число от "+q.min+" до "+q.max+".";return;}
    }
    data[q.key]=v;
  }
  if(q.key==="days"){addModeQ();}
  if(q.key==="mode"){addDayQs();}
  if(i<QUESTIONS.length-1){i++;render();}else{finish();}
}

var PARTS=["Грудь","Спина","Ноги","Руки","Плечи","Пресс","Всё тело"];
var AUTO=[["Грудь","Руки"],["Спина","Плечи"],["Ноги","Пресс"]];

function qIndex(key){
  for(var n=0;n<QUESTIONS.length;n++){if(QUESTIONS[n].key===key){return n;}}
  return -1;
}
function addModeQ(){
  if(qIndex("mode")<0){
    QUESTIONS.splice(qIndex("days")+1,0,{key:"mode",label:"Как составим план по дням?",type:"choice",hint:"Авто-план сам распределит части тела по дням",opts:["Авто-план","Выберу сам"]});
  }
}
function addDayQs(){
  QUESTIONS=QUESTIONS.filter(function(x){return x.key.indexOf("plan:")!==0;});
  if(data.mode!=="Выберу сам"){return;}
  var adds=data.days.map(function(d){
    return {key:"plan:"+d,label:d+": что качаем?",type:"multi",hint:"Можно выбрать несколько",opts:PARTS};
  });
  QUESTIONS.splice.apply(QUESTIONS,[qIndex("mode")+1,0].concat(adds));
}
function autoPlan(days){
  var plan={},n=days.length;
  days.forEach(function(d,idx){
    if(n===1){plan[d]=["Всё тело"];}
    else if(n===2){plan[d]=idx===0?["Грудь","Спина"]:["Ноги","Пресс"];}
    else{plan[d]=AUTO[idx%3].slice();}
  });
  return plan;
}
function buildPlan(){
  var plan={};
  if(data.mode==="Выберу сам"){
    data.days.forEach(function(d){plan[d]=data["plan:"+d]||["Всё тело"];delete data["plan:"+d];});
  }else{plan=autoPlan(data.days);}
  data.plan=plan;
  var u=[];
  Object.keys(plan).forEach(function(d){plan[d].forEach(function(p){if(u.indexOf(p)<0){u.push(p);}});});
  data.parts=u;
}
function partsFor(d){
  return (data.plan&&data.plan[DAYS[d.getDay()]])||data.parts||["Всё тело"];
}
function missingParts(){
  var all=["Грудь","Спина","Ноги","Руки","Плечи","Пресс"];
  if(data.parts.indexOf("Всё тело")>-1){return [];}
  return all.filter(function(p){return data.parts.indexOf(p)<0;});
}
function showPlan(){
  var h=head()+'<p class="q">ПЛАН НЕДЕЛИ</p><ul class="list">',td=DAYS[new Date().getDay()];
  [1,2,3,4,5,6,0].forEach(function(n){
    var d=DAYS[n],pl=data.plan&&data.plan[d];
    h+='<li><span>'+d+(d===td?' •':'')+'</span><b>'+(pl?pl.join(", "):'отдых')+'</b></li>';
  });
  h+='</ul><button class="link" id="back">НАЗАД</button>';
  sys.innerHTML=h;
  document.getElementById("back").onclick=function(){showMain();};
}

function finish(){
  buildPlan();
  data.difficulty=LEVELS[data.level];
  try{localStorage.setItem("spu_profile",JSON.stringify(data));}catch(e){}
  var h=head()+'<p class="q">Данные приняты, '+data.name+'.</p><ul class="list">';
  Object.keys(LABELS).forEach(function(k){
    var val=Array.isArray(data[k])?data[k].join(", "):data[k];
    h+='<li><span>'+LABELS[k]+'</span><b>'+val+(k==="weight"?" кг":k==="height"?" см":"")+'</b></li>';
  });
  data.days.forEach(function(d){h+='<li><span>'+d+'</span><b>'+data.plan[d].join(", ")+'</b></li>';});
  var miss=missingParts();
  h+='</ul>';
  if(miss.length){h+='<p class="note">В плане нет: '+miss.join(", ")+'. Тело растёт ровно, когда качаешь всё.</p>';}
  h+='<button class="btn" id="go">ДАЛЕЕ</button>';
  sys.innerHTML=h;
  document.getElementById("go").onclick=function(){state=newState();save();showMain();};
}

function pad(n){return n<10?"0"+n:""+n;}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function newState(){return {lvl:1,xp:0,stats:{str:0,int:0,end:0,def:0,spd:0,disc:0},v:2,done:[],read:[],prog:null,start:dkey(new Date()),penN:0,missed:[],ach:{},reps:{},streak:0,pens:0,books:0,penFrom:dkey(new Date()),myuli:100,inv:{timeFreeze:1},shadows:[],ownedTitles:[],equippedTitle:null};}

function need(l){return Math.round(100 + Math.pow(l - 1, 1.45) * 65 + (l - 1) * 40);}
function rank(l){return l>=25?"S":l>=20?"A":l>=15?"B":l>=10?"C":l>=5?"D":"E";}
function isTrainingDay(d){return data.days.indexOf(DAYS[d.getDay()])>-1;}

function loadSaved(){
  try{
    var p=localStorage.getItem("spu_profile");
    if(!p){return false;}
    data=JSON.parse(p);
    if(!data.plan){
      data.plan={};
      (data.days||[]).forEach(function(d){data.plan[d]=(data.parts||["Всё тело"]).slice();});
      try{localStorage.setItem("spu_profile",JSON.stringify(data));}catch(e){}
    }
    var s=localStorage.getItem("spu_state");
    state=s?JSON.parse(s):newState();
    if(!state.v||state.v<2){state=newState();s=null;}
    state.penN=state.penN||0;state.missed=state.missed||[];state.ach=state.ach||{};state.reps=state.reps||{};state.streak=state.streak||0;state.pens=state.pens||0;state.books=state.books||0;state.myuli=(state.myuli!==undefined)?state.myuli:100;state.inv=state.inv||{timeFreeze:1};state.shadows=state.shadows||[];state.ownedTitles=state.ownedTitles||[];state.equippedTitle=state.equippedTitle||null;
    if(!state.penFrom){state.penFrom=dkey(new Date());s=null;}
    if(!s){save();}
    return true;
  }catch(e){return false;}
}

var currentBattle=null;

function showBossBattle(id){
  var g=GATES.filter(function(x){return x.id===id;})[0];
  if(!g)return showGates();
  var tl = g.timeLimit || (g.hp * 3.5);
  currentBattle={gate:g,maxHp:g.hp,curHp:g.hp,reps:0,maxTime:tl,timeLeft:tl,frozenLeft:0,berserkLeft:0,greedActive:false};
  runId="boss_"+g.id;
  curT={id:runId,kind:"reps",det:g.det,target:g.hp,upper:false};
  seenAt=0;repPhase="up";lastRepAt=0;lastVT=-1;

  startCam().then(function(ok){
    if(!currentBattle)return;
    renderBattleScreen();
    if(ok){
      loadPose().then(function(){
        if(currentBattle)renderBattleScreen();
      });
    }
  });
}

function retreatBattle(){
  stopCam();
  runId=null;
  curT=null;
  currentBattle=null;
  showGates();
}

function applyDamage(n){
  var b=currentBattle;
  if(!b)return;
  var actualHit = n;
  var isBerserk = (n === 1 && b.berserkLeft > 0);
  if(isBerserk){
    actualHit = 2;
  }
  b.reps += (n === 100 ? 0 : 1);
  b.curHp = Math.max(0, b.curHp - actualHit);

  var av=document.getElementById("boss-avatar");
  if(av){
    av.classList.add("hit");
    setTimeout(function(){av.classList.remove("hit");},200);
  }

  var pct=Math.round(b.curHp/b.maxHp*100);
  var hf=document.getElementById("hp-fill");
  var ht=document.getElementById("hp-text");
  var br=document.getElementById("boss-reps");
  var bl=document.getElementById("battle-log");

  if(hf)hf.style.width=pct+"%";
  if(ht)ht.textContent=b.curHp+" / "+b.maxHp+" HP ("+pct+"%)";
  if(br)br.textContent=b.reps+" / "+b.maxHp;
  if(bl){
    if(n === 100){
      bl.innerHTML='<span style="color:#ff2c7b;font-weight:700">☠️ ЯД ПОРАЗИЛ БОССА НА 100 HP! Осталось: '+b.curHp+' HP</span>';
    } else if(isBerserk){
      bl.innerHTML='<span style="color:#ffd700;font-weight:700">⚡ ЯРОСТЬ БЕРСЕРКА! Критический повтор снёс 2 HP! Осталось: '+b.curHp+' HP</span>';
    } else {
      bl.textContent="💥 Сканер засчитал повтор! Босс потерял "+actualHit+" HP. Осталось: "+b.curHp+" HP";
    }
  }

  if(b.curHp<=0){
    finishBossBattle();
  }
}

function finishBossBattle(){
  stopCam();
  runId=null;
  curT=null;
  var g=currentBattle.gate;
  state.gates=state.gates||{};
  var old=state.gates[g.id]||{clears:0};
  state.gates[g.id]={clears:old.clears+1,lastClear:dkey(new Date())};

  var isFast = (currentBattle.timeLeft >= currentBattle.maxTime * 0.35);
  var extractedShadow = null;
  var duplicateShadow = null;
  var dupTribute = 0;
  var extractionAttempted = false;
  var extractionFailedChance = null;
  var dropList = GATES_DROP_TABLE[g.id] || [];
  if(isFast && dropList.length){
    extractionAttempted = true;
    var roll = Math.random();
    var cursor = 0;
    for(var di=0; di<dropList.length; di++){
      var entry=dropList[di];
      cursor += entry.chance;
      if(roll < cursor){
        var shadowObj=SHADOW_ASSISTANTS.filter(function(x){return x.id===entry.id;})[0];
        if(shadowObj){
          if((state.shadows||[]).indexOf(entry.id)===-1){
            state.shadows=state.shadows||[];
            state.shadows.push(entry.id);
            extractedShadow=shadowObj;
          } else {
            duplicateShadow=shadowObj;
            dupTribute=100;
            state.myuli=(state.myuli||0)+dupTribute;
          }
        }
        break;
      }
    }
    if(!extractedShadow && !duplicateShadow){
      extractionFailedChance=dropList[0].chance;
    }
  }

  var mult = getShadowBonusMult();
  var baseXP = g.rewardXP;
  var earnedXP = Math.round(baseXP * mult);
  var baseMyuli = g.rewardMyuli || 50;
  var myuliMult = getShadowMyuliMult();
  var earnedMyuli = Math.round(baseMyuli * myuliMult);
  var greedBonus = false;
  if(currentBattle && currentBattle.greedActive){
    earnedMyuli = earnedMyuli * 2;
    greedBonus = true;
  }

  state.xp += earnedXP;
  state.myuli = (state.myuli || 0) + earnedMyuli;

  if(g.rewardStr)state.stats.str+=g.rewardStr;
  if(g.rewardEnd)state.stats.end+=g.rewardEnd;

  var start=state.lvl;
  var lvlUps=0;
  while(state.xp>=need(state.lvl)){
    state.xp-=need(state.lvl);
    state.lvl++;
    lvlUps++;
    state.myuli = (state.myuli || 0) + 100;
  }
  var titleWasNew=!state.ach[g.titleId];
  if(titleWasNew){
    state.ach[g.titleId]=dkey(new Date());
    state.title=g.titleId;
  }
  checkAch();
  save();

  var lines=[
    'БОСС '+g.boss.toUpperCase()+' ПОВЕРЖЕН!',
    'Зафиксировано реальных повторений: '+currentBattle.reps,
    'Награда: +'+earnedXP+' XP'+(g.rewardStr?', СИЛА +'+g.rewardStr:'')+(g.rewardEnd?', ВЫНОСЛИВОСТЬ +'+g.rewardEnd:''),
    'Добыча: +'+earnedMyuli+' МЮЛИ 🌀'
  ];
  if(greedBonus){
    lines.push('💰 ЭЛИКСИР АЛЧНОСТИ: Добыча Мюли удвоена!');
  }
  if(mult > 1 || myuliMult > 1){
    lines.push('Бонус теневой армии: XP x' + mult.toFixed(2) + ' • Мюли x' + myuliMult.toFixed(2));
  }
  if(lvlUps > 0){
    lines.push('НОВЫЙ УРОВЕНЬ: '+start+' → '+state.lvl+' (+'+(lvlUps*100)+' Мюли бонус!)');
  }
  if(isFast){
    lines.push('⚡ СКОРОСТНАЯ ЗАЧИСТКА ВРАТ! Остаток времени: ' + Math.ceil(currentBattle.timeLeft) + ' сек.');
  }
  if(extractedShadow){
    lines.push('👑 «ВОССТАНЬ!»: РЕДКИЙ ДРОП! В армию вступил ' + extractedShadow.icon + ' ' + extractedShadow.name + ' (' + extractedShadow.bonusText + ')!');
  } else if(duplicateShadow){
    lines.push('👑 «ВОССТАНЬ!»: повторная тень ' + duplicateShadow.name + ' превратилась в +' + dupTribute + ' МЮЛИ.');
  } else if(extractionAttempted && extractionFailedChance !== null){
    lines.push('🌑 «ВОССТАНЬ!»: тень не выпала. Шансы указаны у этих Врат; легендарный Камиш выпадает лишь с вероятностью 0.5%.');
  } else if(!isFast && dropList.length){
    lines.push('⏳ Чтобы попытаться извлечь тень, сохрани не менее 35% времени таймера.');
  }
  if(titleWasNew)lines.push('НОВЫЙ ТИТУЛ: «'+g.titleName+'»');
  var resTitle = extractedShadow ? 'ТЕНЬ ИЗВЛЕЧЕНА: ВОССТАНЬ!' : (duplicateShadow ? 'ТЕНЕВАЯ ДАНЬ' : 'ВРАТА ЗАЧИЩЕНЫ');
  var resBig = extractedShadow ? (extractedShadow.icon + ' ' + extractedShadow.name.toUpperCase()) : (duplicateShadow ? '+'+dupTribute+' МЮЛИ' : g.name.toUpperCase());
  var resSub = extractedShadow ? ('БУСТ: ' + extractedShadow.bonusText) : ('РАНГ ВРАТ: ' + g.rank);
  currentBattle=null;
  showResult({title:resTitle,big:resBig,sub:resSub,lines:lines,titles:titleWasNew?[g.titleName]:[]});
}

function failBossBattle(){
  stopCam();
  runId = null;
  curT = null;
  var g = currentBattle ? currentBattle.gate : { boss: "БОСС", name: "ВРАТА" };
  currentBattle = null;
  showResult({
    title: 'ПОРАЖЕНИЕ В ПОДЗЕМЕЛЬИ',

function encodeHunterCard(){
  var myTotal = calcTotalXP(state.lvl, state.xp);
  var hunter = {
    v: 1,
    name: (data.name ? data.name.trim() : "ОХОТНИК"),
    lvl: state.lvl,
    xp: myTotal,
    rank: rank(state.lvl),
    title: titleName(),
    ts: Date.now()
  };
  try {
    return "HUNTER-" + btoa(unescape(encodeURIComponent(JSON.stringify(hunter))));
  } catch(e){
    return "HUNTER-1|" + hunter.name + "|" + hunter.lvl + "|" + hunter.xp + "|" + hunter.rank + "|" + hunter.title;
  }
}

function decodeHunterCard(code){
  if(!code || typeof code !== "string") return null;
  code = code.trim();
  if(code.indexOf("HUNTER-") === 0){
    var payload = code.slice(7);
    if(payload.indexOf("1|") === 0){
      var parts = payload.split("|");
      return {
        name: parts[1] || "Охотник",
        lvl: parseInt(parts[2], 10) || 1,
        xp: parseInt(parts[3], 10) || 0,
        rank: parts[4] || "E",
        title: parts[5] || "нет",
        ts: Date.now()
      };
    }
    try {
      var str = decodeURIComponent(escape(atob(payload)));
      var obj = JSON.parse(str);
      if(obj && obj.name && obj.lvl !== undefined){
        return {
          name: String(obj.name).slice(0, 24),
          lvl: parseInt(obj.lvl, 10) || 1,
          xp: parseInt(obj.xp, 10) || 0,
          rank: obj.rank || rank(obj.lvl),
          title: String(obj.title || "нет").slice(0, 80),
          ts: obj.ts || Date.now()
        };
      }
    } catch(e){
      return null;
    }
  }
  return null;
}

function addOrUpdateFriend(friendObj){
  state.friends = state.friends || [];
  var existingIdx = -1;
  for(var i=0; i<state.friends.length; i++){
    if(state.friends[i].name.toLowerCase() === friendObj.name.toLowerCase()){
      existingIdx = i;
      break;
    }
  }
  if(existingIdx >= 0){
    state.friends[existingIdx] = friendObj;
  } else {
    state.friends.push(friendObj);
  }
  save();
}

function copyToClipboard(textToCopy, notifyMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(textToCopy).then(function(){
      alert(notifyMsg || "Скопировано в буфер обмена!");
    }).catch(function(){
      prompt("Скопируй вручную:", textToCopy);
    });
  } else {
    prompt("Скопируй вручную:", textToCopy);
  }
}

function detectorFor(name){
  var n=name.toLowerCase();
  if(/обратные отжим|пайк|стойк/.test(n)){return null;}
  if(/отжиман/.test(n)){return "pushup";}
  if(/присед|выпад/.test(n)){return "legs";}
  if(/подтягив/.test(n)&&!/лопатк|негатив/.test(n)){return "pullup";}
  return null;
}

function parseTask(e,df){
  var m=e[1].match(/(\d+)×(\d+)/),det=detectorFor(e[0]);
  if(det&&m&&e[1].indexOf("сек")<0){
    var mult=/на ногу|на сторону/.test(e[1])?2:1;
    return {kind:"reps",det:det,target:(+m[1])*(+m[2])*mult,upper:det==="pullup"};
  }
  return {kind:"time",dur:TIMES[df]};
}
function taskNeed(t){return t.kind==="reps"?t.target:t.dur;}

function questTasks(){
  if(QMODE==="pen"){return penTasks();}
  var df=data.difficulty,src=[],list=[],pt=partsFor(new Date());
  if(pt.indexOf("Всё тело")>-1){src=BANK["Всё тело"][df];}
  else{
    var per=pt.length===1?5:(pt.length===2?3:2);
    pt.forEach(function(p){
      BANK[p][df].slice(0,per).forEach(function(e){
        if(!src.some(function(x){return x[0]===e[0];})){src.push(e);}
      });
    });
  }
  src.forEach(function(e,idx){
    var inf=parseTask(e,df);
    list.push({id:"e"+idx,kind:inf.kind,det:inf.det,target:inf.target,dur:inf.dur,upper:inf.upper,text:e[0]+" — "+e[1]});
  });
  if(data.mind==="ДА"){list.push({id:"book",kind:"time",dur:BOOKTIME,upper:true,text:"Прочитать книгу — 20 страниц"});}
  return list;
}

function camLive(){
  if(!camStream){return false;}
  var tr=camStream.getVideoTracks();
  return tr.length>0&&tr.every(function(t){return t.readyState==="live"&&t.enabled&&!t.muted;});
}
function stopCam(){
  if(camStream){camStream.getTracks().forEach(function(t){t.stop();});}
  camStream=null;
}
function fmt(sec){sec=Math.max(0,Math.ceil(sec));return pad(Math.floor(sec/60))+":"+pad(sec%60);}

function startCam(){
  camMsg="";
  if(camLive()){return attachCamToVisibleVideo().then(function(){return true;});}
  stopCam();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    camMsg="Камера недоступна: открой файл на опубликованном сайте по HTTPS, а не в предпросмотре/локальном файле. Код: NO_API";
    return Promise.resolve(false);
  }
  return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:640},height:{ideal:480}},audio:false}).then(function(s){
    camStream=s;
    return attachCamToVisibleVideo().then(function(){return true;});
  }).catch(function(e){
    var n=(e&&e.name)||"unknown";
    var m="Камера не включилась. Код: "+n+".";
    if(location.protocol==="file:"||location.protocol==="content:"){m+=" На телефоне локальному HTML часто запрещён доступ к камере. Открой опубликованную HTTPS-ссылку.";}
    else if(n==="NotAllowedError"||n==="SecurityError"){m+=" Разреши сайту доступ к камере в настройках браузера.";}
    else if(n==="NotFoundError"){m+=" Камера не найдена.";}
    else if(n==="NotReadableError"){m+=" Закрой другие приложения, которые используют камеру.";}
    camMsg=m;
    return false;
  });
}
function attachCamToVisibleVideo(){
  var v=document.getElementById("cam");
  if(!v||!camStream){return Promise.resolve(false);}
  if(v.srcObject!==camStream){v.srcObject=camStream;}
  v.muted=true;v.autoplay=true;v.playsInline=true;
  if(v.readyState>=2&&v.videoWidth>0){return Promise.resolve(true);}
  return new Promise(function(resolve){
    var done=false,timer=setTimeout(finish,3500);
    function finish(){if(done)return;done=true;clearTimeout(timer);v.removeEventListener("loadedmetadata",onReady);resolve(v.videoWidth>0);}
    function onReady(){v.play().then(finish).catch(finish);}
    v.addEventListener("loadedmetadata",onReady,{once:true});
    var r=v.play();if(r&&r.then){r.then(function(){if(v.videoWidth>0)finish();}).catch(function(){});}
  });
}

function loadPose(){
  if(pose){return Promise.resolve(true);}
  if(poseP){return poseP;}
  poseState="loading";
  poseP=import(MP+"/vision_bundle.mjs").then(function(m){
    return m.FilesetResolver.forVisionTasks(MP+"/wasm").then(function(fs){
      function make(dl){
        return m.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:dl},runningMode:"VIDEO",numPoses:1});
      }
      return make("GPU").catch(function(){return make("CPU");});
    });
  }).then(function(p){
    pose=p;poseState="ready";return true;
  }).catch(function(){
    poseState="error";poseP=null;
    camMsg="Сканер не загрузился. Нужен интернет. Проверь связь и нажми НАЧАТЬ ещё раз.";
    return false;
  });
  return poseP;
}

function ang(a,b,c){
  var r=Math.atan2(c.y-b.y,c.x-b.x)-Math.atan2(a.y-b.y,a.x-b.x);
  var d=Math.abs(r*180/Math.PI);
  return d>180?360-d:d;
}
function sideAng(l,i1,i2,i3,j1,j2,j3){
  var vl=(l[i1].visibility+l[i2].visibility+l[i3].visibility)/3;
  var vr=(l[j1].visibility+l[j2].visibility+l[j3].visibility)/3;
  var useL=vl>=vr;
  return useL?{a:ang(l[i1],l[i2],l[i3]),vis:vl}:{a:ang(l[j1],l[j2],l[j3]),vis:vr};
}
function bodyVisible(l,upper){
  var ids=upper?[0,11,12]:[11,12,23,24,25,26],n=0;
  ids.forEach(function(i){if(l[i]&&l[i].visibility>0.5){n++;}});
  return n>=(upper?2:3);
}

function countRep(t,l){
  var now=Date.now();
  if(now-lastRepAt<600){return;}
  var hit=false,e;
  if(t.det==="pushup"){
    e=sideAng(l,11,13,15,12,14,16);
    if(e.vis<0.5){return;}
    var sx=(l[11].x+l[12].x)/2,sy=(l[11].y+l[12].y)/2,hx=(l[23].x+l[24].x)/2,hy=(l[23].y+l[24].y)/2;
    if(Math.abs(sy-hy)>Math.abs(sx-hx)){return;}
    if(repPhase==="up"&&e.a<105){repPhase="down";}
    else if(repPhase==="down"&&e.a>150){repPhase="up";hit=true;}
  }else if(t.det==="legs"){
    var ks=[];
    [[23,25,27],[24,26,28]].forEach(function(s){
      var vv=(l[s[0]].visibility+l[s[1]].visibility+l[s[2]].visibility)/3;
      if(vv>0.45){ks.push(ang(l[s[0]],l[s[1]],l[s[2]]));}
    });
    if(!ks.length){return;}
    var mn=Math.min.apply(null,ks),mx=Math.max.apply(null,ks);
    if(repPhase==="up"&&mn<105){repPhase="down";}
    else if(repPhase==="down"&&mx>160){repPhase="up";hit=true;}
  }else if(t.det==="pullup"){
    e=sideAng(l,11,13,15,12,14,16);
    var wv=(l[15].visibility+l[16].visibility)/2;
    if(wv<0.4||e.vis<0.5){return;}
    var wy=(l[15].y+l[16].y)/2;
    if(repPhase==="up"&&l[0].y<wy+0.03&&e.a<110){repPhase="down";}
    else if(repPhase==="down"&&e.a>150){repPhase="up";hit=true;}
  }
  if(hit){
    lastRepAt=now;
    state.reps=state.reps||{};
    state.reps[t.det]=(state.reps[t.det]||0)+1;
    save();
    try{if(navigator.vibrate){navigator.vibrate(40);}}catch(er){}
    if(currentBattle){
      applyDamage(1);
      return;
    }
    var pr=getProg();
    pr.t[t.id]=(pr.t[t.id]||0)+1;
    if(pr.t[t.id]>=t.target){runId=null;showQuest();return;}
    setStat(pr.t[t.id]+"/"+t.target,"");
  }
}

function drawPose(cv,v,l){
  if(!cv){return;}
  if(v.videoWidth&&cv.width!==v.videoWidth){
    cv.width=v.videoWidth;cv.height=v.videoHeight;
    var w=cv.parentNode;
    w.style.aspectRatio=v.videoWidth+"/"+v.videoHeight;
    w.style.width=v.videoWidth>v.videoHeight?"190px":"120px";
  }
  var c=cv.getContext("2d");
  c.clearRect(0,0,cv.width,cv.height);
  if(!l){return;}
  c.lineWidth=Math.max(2,cv.width/120);
  c.strokeStyle="#7be0ff";c.fillStyle="#ffffff";
  LINES.forEach(function(p){
    var a=l[p[0]],b=l[p[1]];
    if(a.visibility<0.4||b.visibility<0.4){return;}
    c.beginPath();c.moveTo(a.x*cv.width,a.y*cv.height);c.lineTo(b.x*cv.width,b.y*cv.height);c.stroke();
  });
  [0,11,12,13,14,15,16,23,24,25,26,27,28].forEach(function(i){
    var p=l[i];
    if(p.visibility<0.4){return;}
    c.beginPath();c.arc(p.x*cv.width,p.y*cv.height,c.lineWidth*1.6,0,6.3);c.fill();
  });
}

function poseStep(){
  var cv=document.getElementById("ov"),v=document.getElementById("cam");
  if(!runId||!pose||!curT||!v||!camLive()||document.visibilityState!=="visible"){
    if(cv){cv.getContext("2d").clearRect(0,0,cv.width,cv.height);}
    return;
  }
  if(v.readyState<2||v.currentTime===lastVT){return;}
  lastVT=v.currentTime;
  var res;
  try{res=pose.detectForVideo(v,performance.now());}catch(e){return;}
  var l=res&&res.landmarks&&res.landmarks[0];
  if(l&&bodyVisible(l,curT.upper)){seenAt=Date.now();}
  if(l&&curT.kind==="reps"&&Date.now()-seenAt<1500){countRep(curT,l);}
  drawPose(cv,v,l);
}

function tick(){
  var now=Date.now(),dt=Math.min(now-lastTick,1500)/1000;
  lastTick=now;
  if(currentBattle&&curT){
    if(currentBattle.berserkLeft > 0){
      currentBattle.berserkLeft -= dt;
      if(currentBattle.berserkLeft < 0) currentBattle.berserkLeft = 0;
    }
    if(currentBattle.frozenLeft > 0){
      currentBattle.frozenLeft -= dt;
      if(currentBattle.frozenLeft < 0) currentBattle.frozenLeft = 0;
    } else {
      currentBattle.timeLeft -= dt;
      if(currentBattle.timeLeft <= 0){
        currentBattle.timeLeft = 0;
        failBossBattle();
        return;
      }
    }
    var tv = document.getElementById("boss-timer-val");
    var tb = document.getElementById("boss-timer-box");
    if(tv){
      var tHtml = '';
      if(currentBattle.frozenLeft > 0){
        tHtml = '<span style="color:#7be0ff">❄️ ЗАМОРОЗКА: ' + Math.ceil(currentBattle.frozenLeft) + ' сек</span> (' + Math.ceil(currentBattle.timeLeft) + 's)';
        if(tb && !tb.classList.contains("freeze-active")) tb.classList.add("freeze-active");
      } else {
        var sec = Math.ceil(currentBattle.timeLeft);
        tHtml = sec + ' сек';
        tv.style.color = (sec <= 15 ? '#ff2c7b' : '#7be0ff');
        if(tb && tb.classList.contains("freeze-active")) tb.classList.remove("freeze-active");
      }
      if(currentBattle.berserkLeft > 0){
        tHtml += ' <span style="color:#ffd700;font-size:12px;display:block">⚡ ЯРОСТЬ (2X УРОН): ' + Math.ceil(currentBattle.berserkLeft) + 'с</span>';
      }
      tv.innerHTML = tHtml;
    }
    var why=whyNot(curT);
    var st=document.getElementById("boss-st");
    if(st){
      st.textContent=why||"Сканер суставов активен! Делай повторение.";
      st.className="stt"+(why?" bad":"");
    }
    var cb=document.getElementById("btn-restart-cam");
    if(cb){cb.style.display=camLive()?"none":"block";}
    return;
  }
  if(!runId||!curT||!document.getElementById("tm")){return;}
  var t=curT,pr=getProg(),why=whyNot(t);
  if(t.kind==="reps"){
    setStat(Math.floor(pr.t[t.id]||0)+"/"+t.target,why);
    return;
  }
  if(!why){
    pr.t[t.id]=(pr.t[t.id]||0)+dt;
    saveCnt++;
    if(saveCnt%5===0){save();}
  }
  var left=t.dur-(pr.t[t.id]||0);
  if(left<=0){pr.t[t.id]=t.dur;runId=null;save();showQuest();return;}
  setStat(fmt(left),why);
}

function leaveQuest(){
  runId=null;curT=null;stopCam();save();showMain();
}

function showQuest(result){
  var now=new Date(),h=head();
  shownAt=Date.now();
  if(QMODE!=="pen"&&!isTrainingDay(now)){
    h+='<p class="q">ДЕНЬ ОТДЫХА</p><p class="note">Сегодня '+DAYS[now.getDay()].toLowerCase()+', тренировки нет. Восстанавливайся.</p>';
    h+='<button class="link" id="back">НАЗАД</button>';
    sys.innerHTML=h;
    document.getElementById("back").onclick=function(){showMain();};
    return;
  }
  if(camStream&&!camLive()&&!runId){stopCam();}
  var pen=QMODE==="pen",done=pen?false:state.done.indexOf(dkey(now))>-1,tasks=questTasks(),pr=getProg(),cur=-1,ok=0;
  tasks.forEach(function(t,idx){
    var on=done||pr.c.indexOf(t.id)>-1;
    if(on){ok++;}else if(cur<0){cur=idx;}
  });
  var all=ok===tasks.length;
  var rt=runId?tasks.filter(function(x){return x.id===runId;})[0]:null;
  curT=rt||null;
  var init=rt?(rt.kind==="reps"?Math.floor(pr.t[rt.id]||0)+"/"+rt.target:fmt(rt.dur-(pr.t[rt.id]||0))):"";
  if(pen){
    h+='<p class="q red">ШТРАФНОЙ КВЕСТ</p><ul class="list"><li><span>Пропущено дней</span><b>'+state.penN+'</b></li><li><span>Награда</span><b>снятие штрафа</b></li></ul>';
  }else{
    h+='<p class="q">ЕЖЕДНЕВНЫЙ КВЕСТ</p><ul class="list">'+
      '<li><span>Тренировка</span><b>'+partsFor(now).join(", ")+'</b></li>'+
      '<li><span>Сложность</span><b>'+data.difficulty+'</b></li>'+
      '<li><span>Награда</span><b>+'+XPGAIN[data.difficulty]+' XP</b></li></ul>';
  }
  if(camStream&&!done){
    h+='<div class="camrow"><div class="camwrap"><video id="cam" autoplay muted playsinline></video><canvas id="ov"></canvas></div><div><div class="tm" id="tm">'+init+'</div><div class="stt" id="st">'+(rt?'':'Камера включена. Нажми НАЧАТЬ.')+'</div><div class="tip">'+(rt?tipFor(rt):'')+'</div><button class="go" id="camBtn" style="display:none">ВКЛЮЧИТЬ КАМЕРУ</button></div></div>';
  }
  tasks.forEach(function(t,idx){
    var el=pr.t[t.id]||0,on=done||pr.c.indexOf(t.id)>-1,nd=taskNeed(t);
    var idle=t.kind==="reps"?'Сканер: '+t.target+' повторов':'Таймер '+fmt(t.dur);
    if(on){
      h+='<div class="trow on"><span class="bx">✔</span><div class="tx">'+t.text+'<small>'+(t.kind==="reps"?t.target+' повторов':fmt(t.dur))+'</small></div></div>';
    }else if(idx>cur){
      h+='<div class="trow lock"><span class="bx"></span><div class="tx">'+t.text+'<small>'+idle+'</small></div></div>';
    }else if(el>=nd-0.01){
      h+='<div class="trow ready"><button class="bx" data-check="'+t.id+'"></button><div class="tx">'+t.text+'<small>Готово. Поставь галочку.</small></div></div>';
    }else{
      var run=runId===t.id;
      var sm=run?'Идёт…':(el>0?(t.kind==="reps"?'Осталось '+Math.ceil(nd-el)+' повторов':'Осталось '+fmt(nd-el)):idle);
      h+='<div class="trow"><span class="bx"></span><div class="tx">'+t.text+'<small>'+sm+'</small></div>'+
        (run?'':'<button class="go" data-start="'+t.id+'">'+(el>0?'ПРОДОЛЖИТЬ':'НАЧАТЬ')+'</button>')+'</div>';
    }
  });
  var msg=camMsg?camMsg:((!done&&!all)?'Задания по порядку. Повторы и время идут только когда сканер видит тебя.':'');
  h+='<p class="note" style="min-height:22px;margin-top:4px'+(camMsg?';color:#ff9ab0;opacity:1':'')+'">'+msg+'</p>';
  if(result){h+='<p class="gain">'+result+'</p>';}
  h+=done?'<button class="btn off" disabled>СЕГОДНЯ ВЫПОЛНЕНО</button>':'<button class="btn'+(all?'':' off')+'" id="finishq"'+(all?'':' disabled')+'>'+(pen?'ШТРАФ ВЫПОЛНЕН':'КВЕСТ ВЫПОЛНЕН')+'</button>';
  h+='<button class="link" id="back">НАЗАД</button>';
  sys.innerHTML=h;
  var v=document.getElementById("cam");
  if(v&&camStream){v.srcObject=camStream;var pl=v.play();if(pl&&pl.catch){pl.catch(function(){});}}
  if(rt){setStat(init,whyNot(rt));}
  Array.prototype.forEach.call(sys.querySelectorAll("[data-start]"),function(b){
    b.onclick=function(){startTask(b.getAttribute("data-start"));};
  });
  Array.prototype.forEach.call(sys.querySelectorAll("[data-check]"),function(b){
    b.onclick=function(){
      var id=b.getAttribute("data-check"),p=getProg(),tk=questTasks().filter(function(x){return x.id===id;})[0];
      if(!tk||(p.t[id]||0)<taskNeed(tk)-0.5||p.c.indexOf(id)>-1){return;}
      p.c.push(id);
      save();
      showQuest();
    };
  });
  var cb=document.getElementById("camBtn");
  if(cb){cb.onclick=function(){startCam().then(function(){showQuest();});};}
  var fq=document.getElementById("finishq");
  if(fq){fq.onclick=pen?completePenalty:completeQuest;}
  document.getElementById("back").onclick=leaveQuest;
}

function penTasks(){
  var m=Math.min(state.penN||1,3),b=PEN[data.difficulty];
  return [
    {id:"p0",kind:"reps",det:"legs",target:b[0]*m,text:"Штрафные приседания — "+(b[0]*m)+" раз"},
    {id:"p1",kind:"reps",det:"pushup",target:b[1]*m,text:"Штрафные отжимания — "+(b[1]*m)+" раз"}
  ];
}

function checkMissed(){
  var t0=new Date(),from=state.penFrom||dkey(t0),d=new Date(t0),changed=false;
  for(var c=0;c<31;c++){
    d.setDate(d.getDate()-1);
    var k=dkey(d);
    if(k<from){break;}
    if(isTrainingDay(d)&&state.done.indexOf(k)<0&&state.missed.indexOf(k)<0){
      state.missed.push(k);
      state.penN=(state.penN||0)+1;
      changed=true;
    }
  }
  if(changed){save();}
}

    var st=SHOP_TITLES.filter(function(t){return t.id===state.equippedTitle;})[0];

    if(!state.ach[a.id]&&a.ok(state)){state.ach[a.id]=today;state.title=a.id;got.push(a.name);}
  });

}

function checkTasksDone(tasks,pr){
  for(var n=0;n<tasks.length;n++){
    if(pr.c.indexOf(tasks[n].id)<0||(pr.t[tasks[n].id]||0)<taskNeed(tasks[n])-0.5){return false;}
  }
  return true;
}

function completeQuest(){
  if(Date.now()-shownAt<700){return;}
  var now=new Date(),k=dkey(now);
  if(QMODE!=="daily"||(state.penN||0)>0||!isTrainingDay(now)||state.done.indexOf(k)>-1){return;}
  var tasks=questTasks(),pr=getProg();
  if(!checkTasksDone(tasks,pr)){return;}
  runId=null;curT=null;stopCam();
  var oldRank=rank(state.lvl),disc=true,d=new Date(now);
  for(var c=0;c<7;c++){
    d.setDate(d.getDate()-1);
    if(dkey(d)<state.start){break;}
    if(isTrainingDay(d)){disc=state.done.indexOf(dkey(d))>-1;break;}
  }
  var g=XPGAIN[data.difficulty];
  var mult=getShadowBonusMult();
  var earnedXP=Math.round(g*mult);
  var myuliMult=getShadowMyuliMult();
  var earnedMyuli=Math.round(60*myuliMult);

  state.done.push(k);
  state.xp+=earnedXP;
  state.myuli=(state.myuli||0)+earnedMyuli;
  state.stats.str+=1;state.stats.end+=1;
  state.streak=disc?(state.streak||0)+1:1;

  var msg="+"+earnedXP+" XP, +"+earnedMyuli+" МЮЛИ 🌀, СИЛА +1, ВЫНОСЛИВОСТЬ +1";
  if(mult>1){
    msg+=" (Буст теней: +"+Math.round(g*(mult-1))+" XP)";
  }
  if(data.mind==="ДА"){state.stats.int+=1;state.books=(state.books||0)+1;msg+=", УМ +1";}
  if(disc){state.stats.disc+=1;msg+=", ДИСЦИПЛИНА +1";}

  var up=false,lvlBonus=0;
  while(state.xp>=need(state.lvl)){
    state.xp-=need(state.lvl);
    state.lvl+=1;
    state.myuli=(state.myuli||0)+100;
    lvlBonus+=100;
    up=true;
  }
  var nt=checkAch();
  save();
  if(up||nt.length){
    var nr=rank(state.lvl);
    var lines=[msg];
    if(lvlBonus>0) lines.push("БОНУС ЗА НОВЫЙ LVL: +"+lvlBonus+" МЮЛИ 🌀");
    showResult({title:up?"УРОВЕНЬ ПОВЫШЕН":"КВЕСТ ВЫПОЛНЕН",big:up?"LVL - "+state.lvl:"",sub:up?(nr!==oldRank?"НОВЫЙ РАНГ: "+nr:"РАНГ "+nr):"",lines:lines,titles:nt});
  }else{
    showQuest(msg);
  }
}

function completePenalty(){
  if(Date.now()-shownAt<700){return;}
  if(QMODE!=="pen"){return;}
  var tasks=questTasks(),pr=getProg();
  if(!checkTasksDone(tasks,pr)){return;}
  runId=null;curT=null;stopCam();
  state.penN=0;state.pprog=null;state.pens=(state.pens||0)+1;
  var penaltyMyuli=Math.round(30*getShadowMyuliMult());
  state.myuli=(state.myuli||0)+penaltyMyuli;
  var nt=checkAch();
  QMODE="daily";
  save();
  showResult({title:"ШТРАФ СНЯТ",lines:["Ежедневный квест снова открыт.","Награда: +30 МЮЛИ 🌀","Не пропускай тренировки."],titles:nt});
}

        addOrUpdateFriend(friend);
        setTimeout(function(){
          alert("✦ Охотник " + friend.name + " (LVL " + friend.lvl + ", Ранг " + friend.rank + ") добавлен в твоих друзей!");
        }, 600);
      }
    }
  } catch(e){}
}
checkUrlFriend();
if(loadSaved()){if(data.mind){showMain();}else{askMind();}}else{render();}
</script>
